; Development PHP configuration for the Docker image.
; Overrides for the production stage belong in a separate ini file.

memory_limit = 256M
max_execution_time = 120
max_input_time = 60
post_max_size = 20M
upload_max_filesize = 20M
date.timezone = UTC
expose_php = Off

; OPcache is installed lazily (enable the extension in the image) and
; disabled by default in development; enable it for production.
opcache.enable = 0
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1